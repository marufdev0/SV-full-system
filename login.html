<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoftVerse IT — Login</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #2b3a67;
  --muted: #6b7280;
  --primary: #14a89a;
  --primary-dark: #0f8377;
  --success: #16a34a;
  --pending: #f59e0b;
  --progress: #3b82f6;
  --border: #e5e7eb;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
.container { width: 100%; max-width: 400px; }
.logo { display: block; max-width: 200px; width: 100%; height: auto; margin: 0 auto 18px; }
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; text-align: center; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}
input:focus { border-color: var(--primary); }
button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: var(--primary);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 18px;
}
button:hover { background: var(--primary-dark); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.error { color: #dc2626; font-size: 13px; margin-top: 10px; display: none; text-align: center; }
@media (max-width: 360px) {
  body { padding: 16px 10px; }
  .card { padding: 20px; }
}
</style>
</head>

    <div class="subtitle">Log in with your Employee ID and PIN</div>
    <label>Employee ID</label>
    <input id="employeeId" placeholder="e.g. SVT01" autocomplete="off">
    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <button id="loginBtn" onclick="doLogin()">Login</button>
    <div id="loginError" class="error"></div>
  </div>
</div>
<script>
// Paste your Apps Script Web App URL here (must end with /exec)
const GAS_URL = "https://script.google.com/macros/s/AKfycbyn-2oHEHRZleuLm7L6nma7i8GjffAuJh-f547lgsewvRlkINAljGayvQ7jXYv-yqF-/exec";

async function callApi(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

const PANEL_PAGE = {
  'Team': 'team.html',
  'Office': 'office.html',
  'Admin': 'admin.html'
};

async function doLogin() {
  const employeeId = document.getElementById('employeeId').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const loginError = document.getElementById('loginError');
  loginError.style.display = 'none';

  if (!employeeId || !pin) {
    loginError.textContent = 'Please enter both Employee ID and PIN';
    loginError.style.display = 'block';
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Checking...';

  try {
    const result = await callApi({ action: 'login', employeeId, pin });
    if (result.success) {
      localStorage.setItem('sv_employeeId', result.employeeId);
      localStorage.setItem('sv_name', result.name);
      localStorage.setItem('sv_role', result.role);
      localStorage.setItem('sv_panel', result.panel);
      // Login-এর সাথেই আসা Task ডেটা সেশনে রেখে দেওয়া, যাতে পরের পেজে আবার লোড করতে না হয়
      if (result.members) {
        sessionStorage.setItem('sv_initialTasks', JSON.stringify(result.members));
      }

      const targetPage = PANEL_PAGE[result.panel];
      if (targetPage) {
        window.location.href = targetPage;
      } else {
        loginError.textContent = 'No Panel is set for this account — check the Panel column in Team Members sheet';
        loginError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    } else {
      loginError.textContent = result.message || 'Invalid ID or PIN';
      loginError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  } catch (err) {
    loginError.textContent = 'Connection error: ' + (err.message || err);
    loginError.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}

window.onload = function () {
  const panel = localStorage.getItem('sv_panel');
  const targetPage = PANEL_PAGE[panel];
  if (targetPage) {
    window.location.href = targetPage;
  }
};
</script>
