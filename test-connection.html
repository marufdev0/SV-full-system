<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Test</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 30px; max-width: 500px; margin: 0 auto; }
  button { padding: 14px 20px; font-size: 16px; background: #14a89a; color: white; border: none; border-radius: 8px; cursor: pointer; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f4f5f7; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
  <h2>Apps Script সংযোগ টেস্ট</h2>
  <button onclick="testConnection()">সংযোগ টেস্ট</button>
  <div id="result">এখনো টেস্ট করা হয়নি</div>

  <h2 style="margin-top:30px;">Login টেস্ট</h2>
  <input id="employeeId" placeholder="Employee ID (যেমন SVT01)" style="padding:10px; width:100%; margin-bottom:10px; box-sizing:border-box;">
  <input id="pin" placeholder="PIN" style="padding:10px; width:100%; margin-bottom:10px; box-sizing:border-box;">
  <button onclick="testLogin()">Login টেস্ট</button>
  <div id="loginResult">এখনো টেস্ট করা হয়নি</div>

<script>
  // এখানে আপনার Apps Script Web App URL বসান (.../exec দিয়ে শেষ হবে)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxKB307HVa4d5uIZO_Z8UJ0-E_5m1PB9hx-PuFfKWr40083NngT5qCEJYu4Cje_xuC4/exec";

  async function testConnection() {
    const result = document.getElementById('result');
    result.textContent = 'পাঠানো হচ্ছে...';
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'test' })
      });
      const text = await res.text();
      result.textContent = 'Status: ' + res.status + '\n\nResponse:\n' + text;
    } catch (err) {
      result.textContent = 'Error: ' + err.message;
    }
  }

  async function testLogin() {
    const employeeId = document.getElementById('employeeId').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const result = document.getElementById('loginResult');
    result.textContent = 'পাঠানো হচ্ছে...';
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', employeeId, pin })
      });
      const text = await res.text();
      result.textContent = 'Status: ' + res.status + '\n\nResponse:\n' + text;
    } catch (err) {
      result.textContent = 'Error: ' + err.message;
    }
  }
</script>
</body>
</html>
